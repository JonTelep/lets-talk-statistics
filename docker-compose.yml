services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_NAME: Let's Talk Statistics
    container_name: lts_app
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: "3003"
      # Optional: set FRED_API_KEY for housing data
      FRED_API_KEY: ${FRED_API_KEY:-}
      TRADES_API_URL: ${TRADES_API_URL:-https://trades.telep.io}
    restart: unless-stopped
